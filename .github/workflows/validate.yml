name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  # Preserve an expensive cold runtime build; only the latest pending run waits.
  cancel-in-progress: false
permissions:
  contents: read
env:
  KUJO_COMMIT: 262b3e7517ac47edca843120dd8689c0c820d62e
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
jobs:
  kujo-native:
    # Same-repository branches already run on push; forks still need PR checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-2022' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      # Exact-pin caches are saved only after both native conformance gates pass.
      # Application validation and the behavioral runtime probe always run.
      - name: Restore pinned runtime build
        id: runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime/kujo/target
          key: stable-runtime-${{ matrix.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}-opt1-v1${{ runner.os == 'Windows' && '-crt-static-target' || '' }}
      - name: Install Windows crypto assembler
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed" }
          $assembler = 'C:\Program Files\NASM'
          & "$assembler\nasm.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "NASM unavailable" }
          $assembler | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg" }
          "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build pinned Kujo runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo build --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml
      - name: Native filesystem conformance
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --lib beneath_tests
      - name: Directory API runtime and capability parity
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test directory_page_contract
      - name: Adapter I/O runtime parity
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test bounded_stdin --test rooted_digest
      - name: Lexical scope regression
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test vm_interpreter_parity_surfaces top_level_functions
      - name: Save verified runtime build
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime/kujo/target
          key: stable-runtime-${{ matrix.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}-opt1-v1${{ runner.os == 'Windows' && '-crt-static-target' || '' }}
      - name: Validate
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc/' || '' }}release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash scripts/validate.sh
      - name: Windows native launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          KUJO_BIN: ${{ github.workspace }}\.runtime\kujo\target\x86_64-pc-windows-msvc\release\kujo.exe
        run: bin\bluepencil.cmd --version --json
      - name: Windows distribution has no Visual C++ redistributable dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $inspector = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inspector) { throw "PE dependency inspector unavailable" }
          $dependencies = & $inspector.FullName /dependents .runtime/kujo/target/x86_64-pc-windows-msvc/release/kujo.exe
          if ($LASTEXITCODE -ne 0) { throw "PE dependency inspection failed" }
          $dependencies | Write-Output
          if ($dependencies -match '(?i)VCRUNTIME|MSVCP[0-9]|ucrtbased') { throw "Unexpected redistributable runtime dependency" }
      - name: macOS distribution uses only system dynamic libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -L .runtime/kujo/target/release/kujo
          while read -r library; do
            case "$library" in /usr/lib/*|/System/Library/*) ;; *) echo "Unexpected library: $library" >&2; exit 1 ;; esac
          done < <(otool -L .runtime/kujo/target/release/kujo | tail -n +2 | awk '{print $1}')
      - name: Package checked candidate and test isolated installation
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc/' || '' }}release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
          KUJO_SOURCE_ROOT: ${{ github.workspace }}/.runtime/kujo
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package.sh
      - name: Install Linux bundle in a clean offline OS container
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify_linux_bundle.sh "$PWD/dist" "${{ matrix.platform }}"
      - name: Upload checksummed candidate bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bluepencil-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  installed-platforms:
    needs: kujo-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Windows-X64
          - os: windows-2025
            artifact: Windows-X64
          - os: windows-11-arm
            artifact: Windows-X64
          - os: macos-15
            artifact: macOS-ARM64
          - os: macos-15-intel
            artifact: macOS-X64
          - os: macos-26
            artifact: macOS-ARM64
          - os: macos-26-intel
            artifact: macOS-X64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bluepencil-${{ matrix.artifact }}-${{ github.sha }}
          path: bundles
      - name: Clean macOS install with network denied
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd bundles
          shasum -a 256 -c ./*.sha256
          mkdir "$RUNNER_TEMP/BluePencil clean installation"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/BluePencil clean installation"
          roots=("$RUNNER_TEMP/BluePencil clean installation"/bluepencil-*)
          test "${#roots[@]}" = 1
          cd "${roots[0]}"
          /usr/bin/sandbox-exec -p '(version 1) (allow default) (deny network*)' ./runtime/kujo run tests/release_install.kujo -- "$PWD"
          ./runtime/kujo run tests/upgrade_test.kujo
      - name: Clean Windows native launcher install with outbound traffic blocked
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem bundles/*.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected one archive' }
          $checksum = (Get-Content (Get-ChildItem bundles/*.sha256).FullName).Split(' ')[0]
          if ((Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $checksum) { throw 'Checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'BluePencil clean installation'
          New-Item -ItemType Directory -Path $destination | Out-Null
          tar -xzf $archives[0].FullName -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $root = @(Get-ChildItem $destination -Directory)
          if ($root.Count -ne 1) { throw 'Expected one installation' }
          $runtime = Join-Path $root[0].FullName 'runtime/kujo.exe'
          New-NetFirewallRule -DisplayName 'BluePencil installation no network' -Direction Outbound -Program $runtime -Action Block | Out-Null
          try {
            Set-Location $root[0].FullName
            & $runtime run tests/release_install.kujo -- $root[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Clean launcher assertions failed' }
            & $runtime run tests/upgrade_test.kujo
            if ($LASTEXITCODE -ne 0) { throw 'Upgrade assertions failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName 'BluePencil installation no network'
          }
