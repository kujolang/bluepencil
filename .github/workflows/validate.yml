name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  KUJO_COMMIT: 262b3e7517ac47edca843120dd8689c0c820d62e
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
jobs:
  kujo-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      # Exact-pin caches are saved only after both native conformance gates pass.
      # Application validation and the behavioral runtime probe always run.
      - name: Restore pinned runtime build
        id: runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime/kujo/target
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}-opt1-v1
      - name: Configure OpenSSL for Windows
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg" }
          vcpkg install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build pinned Kujo runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo build --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml
      - name: Native filesystem conformance
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --lib beneath_tests
      - name: Directory API runtime and capability parity
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test directory_page_contract
      - name: Adapter I/O runtime parity
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test bounded_stdin --test rooted_digest
      - name: Lexical scope regression
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: cargo test --release --no-default-features --locked --manifest-path .runtime/kujo/Cargo.toml --test vm_interpreter_parity_surfaces top_level_functions
      - name: Save verified runtime build
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime/kujo/target
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}-opt1-v1
      - name: Validate
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash scripts/validate.sh
      - name: Windows native launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          KUJO_BIN: ${{ github.workspace }}\.runtime\kujo\target\release\kujo.exe
        run: bin\bluepencil.cmd --version --json
      - name: Package checked candidate and test isolated installation
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
          KUJO_SOURCE_ROOT: ${{ github.workspace }}/.runtime/kujo
          BUNDLE_PLATFORM: ${{ runner.os == 'Windows' && 'windows-x64' || runner.os == 'macOS' && (runner.arch == 'ARM64' && 'macos-arm64' || 'macos-x64') || 'linux-x64' }}
        run: bash scripts/package.sh
      - name: Upload checksummed candidate bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bluepencil-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
